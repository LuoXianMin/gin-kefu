# github.com/flipped-aurora/gin-vue-admin/server Global Configuration

# jwt configuration
jwt:
    signing-key: qmPlus
    expires-time: 7d
    buffer-time: 1d
    issuer: qmPlus
# zap logger configuration
zap:
    level: info
    format: console
    prefix: "[github.com/flipped-aurora/gin-vue-admin/server]"
    director: log
    show-line: true
    encode-level: LowercaseColorLevelEncoder
    stacktrace-key: stacktrace
    log-in-console: true
    retention-day: -1

# redis configuration
redis:
    #是否使用redis集群模式
    useCluster: false
    #使用集群模式addr和db默认无效
    addr: gva-redis:6379
    password: ""
    db: 0
    clusterAddrs:
        - "gva-redis:7000"
        - "gva-redis:7001"
        - "gva-redis:7002"

# redis-list configuration
redis-list:
    - name: cache           # 数据库的名称,注意: name 需要在 redis-list 中唯一
      useCluster: false     # 是否使用redis集群模式
      addr: gva-redis:6379  # 使用集群模式addr和db默认无效
      password: ""
      db: 0
      clusterAddrs:
          - "gva-redis:7000"
          - "gva-redis:7001"
          - "gva-redis:7002"

# mongo configuration
mongo:
    coll: ''
    options: ''
    database: 'gva'
    username: ''
    password: ''
    auth-source: ''
    min-pool-size: 0
    max-pool-size: 100
    socket-timeout-ms: 0
    connect-timeout-ms: 0
    is-zap: false
    hosts:
        - host: 'gva-mongo'
          port: '27017'

# kafka configuration (客服系统消息链路, 单机 KRaft)
kafka:
    enabled: true
    brokers:
        - 'gva-kafka:9092'
    topic: 'im.message'
    event-topic: 'im.conversation.event'
    storage-group: 'cg-storage'
    dispatch-group: 'cg-dispatch'
    ws-addr: ':8889'

# email configuration
email:
    to: xxx@qq.com
    port: 465
    from: xxx@163.com
    host: smtp.163.com
    is-ssl: true
    secret: xxx
    nickname: test

# system configuration
system:
    env: local # 修改为public可以关闭路由日志输出
    addr: 8888
    db-type: pgsql
    oss-type: local # 控制oss选择走本地还是 七牛等其他仓 自行增加其他oss仓可以在 server/utils/upload/upload.go 中 NewOss函数配置
    use-redis: true # 使用redis
    use-mongo: true     # 使用mongo
    use-multipoint: false
    # IP限制次数 一个小时15000次
    iplimit-count: 15000
    #  IP限制一个小时
    iplimit-time: 3600
    #  路由全局前缀
    router-prefix: ""
    #  严格角色模式 打开后权限将会存在上下级关系
    use-strict-auth: false

# SSO 渠道免密进入(客服系统 h5 ?user= AES 参数)
sso:
    aes-key-env: GVA_CS_SSO_KEY # 密钥由 compose environment 注入; 未注入=接口拒绝服务
    max-age-sec: 3600 # 明文 ts 字段允许的最大时效(秒), 0=不校验时效
# captcha configuration
captcha:
    key-long: 6
    img-width: 240
    img-height: 80
    open-captcha: 0 # 0代表一直开启，大于0代表限制次数
    open-captcha-timeout: 3600 # open-captcha大于0时才生效

# sms 短信验证码配置(客服系统三端 MFA 登录) 开发 Compose 环境: log 通道 + 返回验证码
sms:
    provider: log           # log=仅写日志不真发(开发默认) | aliyun=真发阿里云短信 | http=自定义 HMAC 网关
    endpoint: ""            # http 必填; aliyun 留空则用 https://dysmsapi.aliyuncs.com
    access-key-env: GVA_SMS_AK
    secret-key-env: GVA_SMS_SK
    sign-name: ""
    template-code: ""
    region: ""              # aliyun 地域, 留空=cn-hangzhou
    template-param-key: ""  # aliyun 模板验证码变量名, 留空=code
    code-length: 6
    code-ttl-seconds: 300
    send-time-limit: 60
    daily-limit: 10
    max-fail-count: 5
    dev-return-code: true

# mysql connect configuration
# 未初始化之前请勿手动修改数据库信息！！！如果一定要手动初始化请看（https://gin-vue-admin.com/docs/first_master）
mysql:
    path: ""
    port: ""
    config: ""
    db-name: ""
    username: ""
    password: ""
    max-idle-conns: 10
    max-open-conns: 100
    log-mode: ""
    log-zap: false

# pgsql connect configuration
# 未初始化之前请勿手动修改数据库信息！！！如果一定要手动初始化请看（https://gin-vue-admin.com/docs/first_master）
pgsql:
    path: "gva-pgsql"
    port: "5432"
    config: "sslmode=disable"
    db-name: "gva"
    username: "gva"
    password: "gva123"
    max-idle-conns: 10
    max-open-conns: 100
    log-mode: ""
    log-zap: false
oracle:
    path: ""
    port: ""
    config: ""
    db-name: ""
    username: ""
    password: ""
    max-idle-conns: 10
    max-open-conns: 100
    log-mode: ""
    log-zap: false
mssql:
    path: ""
    port: ""
    config: ""
    db-name: ""
    username: ""
    password: ""
    max-idle-conns: 10
    max-open-conns: 100
    log-mode: ""
    log-zap: false
sqlite:
    path: ""
    port: ""
    config: ""
    db-name: ""
    username: ""
    password: ""
    max-idle-conns: 10
    max-open-conns: 100
    log-mode: ""
    log-zap: false
db-list:
    - disable: true # 是否禁用
      type: "" # 数据库的类型,目前支持mysql、pgsql、mssql、oracle
      alias-name: "" # 数据库的名称,注意: alias-name 需要在db-list中唯一
      path: ""
      port: ""
      config: ""
      db-name: ""
      username: ""
      password: ""
      max-idle-conns: 10
      max-open-conns: 100
      log-mode: ""
      log-zap: false

# local configuration
local:
    path: uploads/file
    store-path: uploads/file

# autocode configuration
autocode:
    web: web/src
    root: "" # root 自动适配项目根目录, 请不要手动配置,他会在项目加载的时候识别出根路径
    server: server
    module: 'github.com/flipped-aurora/gin-vue-admin/server'
    ai-path: ""  # AI服务路径

# aliyun oss configuration
aliyun-oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    access-key-id: ''      # 真实值走 .env GVA_OSS_ACCESS_KEY_ID(按 oss-type 自动落到本段)
    access-key-secret: ''  # 同上 GVA_OSS_ACCESS_KEY_SECRET; 此处清空后若 env 未注入则上传会明确报错, 优于静默使用错误凭证
    bucket-name: huashop
    bucket-url: https://huashop.oss-cn-beijing.aliyuncs.com
    base-path: kefu

# aws s3 configuration (minio compatible)
aws-s3:
    bucket: xxxxx-10005608
    region: ap-shanghai
    endpoint: ""
    s3-force-path-style: false
    disable-ssl: false
    secret-id: your-secret-id
    secret-key: your-secret-key
    base-url: https://gin.vue.admin
    path-prefix: github.com/flipped-aurora/gin-vue-admin/server

# cloudflare r2 configuration
cloudflare-r2:
    bucket: xxxx0bucket
    base-url: https://gin.vue.admin.com
    path: uploads
    account-id: xxx_account_id
    access-key-id: xxx_key_id
    secret-access-key: xxx_secret_key


# excel configuration
excel:
    dir: ./resource/excel/

# disk usage configuration
disk-list:
    - mount-point: "/"

# 跨域配置
# 需要配合 server/initialize/router.go -> `Router.Use(middleware.CorsByRules())` 使用
cors:
    mode: strict-whitelist # 放行模式: allow-all, 放行全部; whitelist, 白名单模式, 来自白名单内域名的请求添加 cors 头; strict-whitelist 严格白名单模式, 白名单外的请求一律拒绝
    whitelist:
        # 本机开发源: 浏览器对同源 POST 也带 Origin 头, vite 代理(8090/8091/8099等)透传后被 strict-whitelist 403, 故加 localhost 通配(对生产无影响)
        - allow-origin: http://localhost:*
          allow-headers: Content-Type,AccessToken,X-CSRF-Token, Authorization, Token,X-Token,X-User-Id
          allow-methods: POST, GET, OPTIONS, DELETE, PUT
          expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, New-Token, New-Expires-At
          allow-credentials: true
        - allow-origin: http://127.0.0.1:*
          allow-headers: Content-Type,AccessToken,X-CSRF-Token, Authorization, Token,X-Token,X-User-Id
          allow-methods: POST, GET, OPTIONS, DELETE, PUT
          expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, New-Token, New-Expires-At
          allow-credentials: true
        # 生产直连前端源: 平台后台/商户后台/H5 按租户动态子域(kfadmin<hash>.laigoushangcheng.cn 等), 用通配符覆盖 http/https 两协议
        - allow-origin: http://*.laigoushangcheng.cn
          allow-headers: Content-Type,AccessToken,X-CSRF-Token, Authorization, Token,X-Token,X-User-Id
          allow-methods: POST, GET, OPTIONS, DELETE, PUT
          expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, New-Token, New-Expires-At
          allow-credentials: true
        - allow-origin: https://*.laigoushangcheng.cn
          allow-headers: Content-Type,AccessToken,X-CSRF-Token, Authorization, Token,X-Token,X-User-Id
          allow-methods: POST, GET, OPTIONS, DELETE, PUT
          expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, New-Token, New-Expires-At
          allow-credentials: true
        - allow-origin: example1.com
          allow-headers: Content-Type,AccessToken,X-CSRF-Token, Authorization, Token,X-Token,X-User-Id
          allow-methods: POST, GET
          expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type

          allow-credentials: true # 布尔值
        - allow-origin: example2.com
          allow-headers: content-type
          allow-methods: GET, POST
          expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type
          allow-credentials: true # 布尔值
mcp:
    name: GVA_MCP
    version: v1.0.0
    addr: 8889
    separate: false
